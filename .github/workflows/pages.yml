name: Build CopperReview WASM and Pages

# Every push to main builds, tests and deploys against the CopperScript commit pinned
# in .copperscript-version. Run it manually to try another compiler commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: CopperScript commit (blank uses .copperscript-version)
        required: false
        type: string
      publish:
        description: Deploy the checked static package to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: copper-review-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: CopperReview
          persist-credentials: false
      - name: Require an exact compiler commit
        id: compiler
        env:
          COMPILER_REF: ${{ inputs.compiler_ref }}
        run: |
          ref="${COMPILER_REF:-$(tr -d '[:space:]' < CopperReview/.copperscript-version)}"
          [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "compiler ref must be a full commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: andenore/CopperScript
          ref: ${{ steps.compiler.outputs.ref }}
          path: CopperScript
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare pinned WASM tools
        working-directory: CopperScript
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked wasm-bindgen-cli --version 0.2.130
          cargo test --locked --release -p copper-web
      - name: Build and check the actual compiler and static viewer
        working-directory: CopperReview
        run: |
          npm test
          npm run build:wasm
          npm run test:wasm
          npm run test:body
          npm run build:occt
          npm run build:static
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: CopperReview/dist
  deploy:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
